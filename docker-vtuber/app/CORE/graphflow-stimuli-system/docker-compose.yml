version: '3.8'

services:
  # GraphFlow Gateway - New System
  graphflow-gateway:
    build: .
    ports:
      - "8080:8080"  # GraphFlow API port
    environment:
      # Core settings
      - GRAPHFLOW_LOG_LEVEL=INFO
      - GRAPHFLOW_MAX_CONCURRENT_STIMULI=50
      - GRAPHFLOW_PROCESSING_TIMEOUT=30.0
      
      # LLM settings (using existing Ollama)
      - GRAPHFLOW_LLM_PROVIDER=ollama
      - GRAPHFLOW_LLM_MODEL=llama3.2:3b
      - GRAPHFLOW_LLM_ENDPOINT=http://host.docker.internal:11434
      
      # Integration with existing systems
      - SYSTEM1_VTUBER_ENDPOINT=http://host.docker.internal:5001
      - SYSTEM2_AUTOGEN_ENDPOINT=http://host.docker.internal:3100
      
      # Database connections
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:graphflow123@postgres:5432/graphflow
      
      # Monitoring
      - METRICS_ENABLED=true
      - PROMETHEUS_PORT=9090
      - DETAILED_LOGGING=true
      
      # Security
      - API_KEYS_FILE=/app/config/api_keys.json
      - RATE_LIMIT_REQUESTS_PER_MINUTE=60
      
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - graphflow-network
      - default

  # Redis for state management and caching
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - graphflow-network

  # PostgreSQL for persistent storage
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: graphflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: graphflow123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    restart: unless-stopped
    networks:
      - graphflow-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"  # Different port to avoid conflicts
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - graphflow-network

  # Grafana for monitoring dashboard
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"  # Different port to avoid conflicts
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: unless-stopped
    networks:
      - graphflow-network

  # Test client for sending stimuli
  test-client:
    build:
      context: .
      dockerfile: docker/Dockerfile.test-client
    environment:
      - GRAPHFLOW_ENDPOINT=http://graphflow-gateway:8080
      - API_KEY=test_api_key_123
    volumes:
      - ./tests/data:/app/test_data
    depends_on:
      - graphflow-gateway
    profiles:
      - testing
    networks:
      - graphflow-network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  graphflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Development override file usage:
# docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

---
# Additional configurations for different environments

# For production deployment:
# docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

# For testing with mock services:
# docker-compose -f docker-compose.yml -f docker-compose.test.yml up

# To include test client:
# docker-compose --profile testing up

# To scale the gateway:
# docker-compose up -d --scale graphflow-gateway=3 