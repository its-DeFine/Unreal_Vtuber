# Development overrides for docker-compose.yml
services:
  graphflow-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    environment:
      - GRAPHFLOW_LOG_LEVEL=DEBUG
      - DETAILED_LOGGING=true
      - RELOAD_ON_CHANGE=true
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config
      - ./logs:/app/logs
    command: ["python", "-m", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]

  # Development tools
  adminer:
    image: adminer
    ports:
      - "8081:8080"
    networks:
      - graphflow-network
    profiles:
      - dev-tools

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8082:8081"
    networks:
      - graphflow-network
    profiles:
      - dev-tools