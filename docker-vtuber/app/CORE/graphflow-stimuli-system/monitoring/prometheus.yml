global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'graphflow-monitor'

scrape_configs:
  # GraphFlow Gateway metrics
  - job_name: 'graphflow-gateway'
    static_configs:
      - targets: ['graphflow-gateway:9090']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis exporter (if needed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # PostgreSQL exporter (if needed)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 15s

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

# Alerting rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []