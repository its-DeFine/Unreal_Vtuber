<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Knowledge Graph Viewer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        
        #controls h3 {
            margin: 0 0 10px 0;
            color: #4fc3f7;
        }
        
        #controls button, #controls select {
            display: block;
            margin: 5px 0;
            padding: 8px 15px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
        }
        
        #controls button:hover {
            background: #1976d2;
        }
        
        #controls select {
            background: #333;
            border: 1px solid #555;
        }
        
        #info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            max-width: 300px;
            display: none;
            z-index: 1000;
        }
        
        #info h4 {
            margin: 0 0 5px 0;
            color: #4fc3f7;
        }
        
        #info p {
            margin: 5px 0;
            font-size: 12px;
        }
        
        #legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
        }
        
        #legend h4 {
            margin: 0 0 10px 0;
            color: #4fc3f7;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        #graph {
            width: 100vw;
            height: 100vh;
        }
        
        .node {
            cursor: pointer;
        }
        
        .node circle {
            stroke: #fff;
            stroke-width: 2px;
        }
        
        .node text {
            font-size: 12px;
            pointer-events: none;
            text-anchor: middle;
            fill: #fff;
        }
        
        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }
        
        .link-label {
            font-size: 10px;
            fill: #aaa;
            text-anchor: middle;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #4fc3f7;
        }
        
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(244,67,54,0.9);
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>Graph Controls</h3>
        <select id="contextFilter">
            <option value="">All Contexts</option>
            <option value="general_context">General</option>
            <option value="s2_to_s1_messages">S2→S1 Messages</option>
            <option value="s1_to_s2_feedback">S1→S2 Feedback</option>
            <option value="tool_executions">Tool Executions</option>
            <option value="stimuli_context">Stimuli Processing</option>
            <option value="agent_state">Agent State</option>
            <option value="trading_finance">Trading/Finance</option>
            <option value="system_events">System Events</option>
        </select>
        <button onclick="loadGraph()">Refresh Graph</button>
        <button onclick="exportGraph('json')">Export JSON</button>
        <button onclick="exportGraph('cytoscape')">Export Cytoscape</button>
        <button onclick="togglePhysics()">Toggle Physics</button>
        <button onclick="fitToScreen()">Fit to Screen</button>
    </div>
    
    <div id="legend">
        <h4>Context Types</h4>
        <div class="legend-item">
            <div class="legend-color" style="background: #1f77b4;"></div>
            <span>General</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ff7f0e;"></div>
            <span>S2→S1 Messages</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2ca02c;"></div>
            <span>S1→S2 Feedback</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #d62728;"></div>
            <span>Tool Executions</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #9467bd;"></div>
            <span>Stimuli</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #8c564b;"></div>
            <span>Agent State</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #e377c2;"></div>
            <span>Trading/Finance</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #7f7f7f;"></div>
            <span>System Events</span>
        </div>
    </div>
    
    <div id="info"></div>
    <div id="loading">Loading semantic graph...</div>
    <div id="error"></div>
    
    <svg id="graph"></svg>
    
    <script>
        // Configuration
        const API_BASE = '/api/semantic-map';
        const contextColors = {
            'general_context': '#1f77b4',
            's2_to_s1_messages': '#ff7f0e',
            's1_to_s2_feedback': '#2ca02c',
            'tool_executions': '#d62728',
            'stimuli_context': '#9467bd',
            'agent_state': '#8c564b',
            'trading_finance': '#e377c2',
            'system_events': '#7f7f7f',
            'default': '#17a2b8'
        };
        
        let simulation;
        let svg;
        let g;
        let physicsEnabled = true;
        let currentData = null;
        
        // Initialize D3
        function initGraph() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            svg = d3.select('#graph')
                .attr('width', width)
                .attr('height', height);
            
            // Add zoom behavior
            const zoom = d3.zoom()
                .scaleExtent([0.1, 10])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
            // Container for graph elements
            g = svg.append('g');
            
            // Initialize force simulation
            simulation = d3.forceSimulation()
                .force('link', d3.forceLink().id(d => d.id).distance(100))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(30));
        }
        
        // Load graph data
        async function loadGraph() {
            const context = document.getElementById('contextFilter').value;
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            
            try {
                const url = context ? 
                    `${API_BASE}/export?format=d3js&context=${context}` : 
                    `${API_BASE}/export?format=d3js`;
                
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error);
                }
                
                currentData = result.data;
                renderGraph(currentData);
                
            } catch (err) {
                console.error('Error loading graph:', err);
                error.textContent = `Error: ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // Render the graph
        function renderGraph(data) {
            // Clear existing elements
            g.selectAll('*').remove();
            
            // Add arrow markers for directed edges
            g.append('defs').selectAll('marker')
                .data(['end'])
                .enter().append('marker')
                .attr('id', 'arrow')
                .attr('viewBox', '0 -5 10 10')
                .attr('refX', 25)
                .attr('refY', 0)
                .attr('markerWidth', 8)
                .attr('markerHeight', 8)
                .attr('orient', 'auto')
                .append('path')
                .attr('d', 'M0,-5L10,0L0,5')
                .attr('fill', '#999');
            
            // Create links
            const link = g.append('g')
                .selectAll('line')
                .data(data.links)
                .enter().append('line')
                .attr('class', 'link')
                .attr('marker-end', 'url(#arrow)')
                .attr('stroke-width', d => Math.sqrt(d.value));
            
            // Create link labels
            const linkLabel = g.append('g')
                .selectAll('text')
                .data(data.links)
                .enter().append('text')
                .attr('class', 'link-label')
                .text(d => d.type);
            
            // Create nodes
            const node = g.append('g')
                .selectAll('.node')
                .data(data.nodes)
                .enter().append('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
            // Add circles
            node.append('circle')
                .attr('r', d => d.type === 'entity' ? 15 : 10)
                .attr('fill', d => contextColors[d.group] || contextColors.default)
                .on('click', showNodeInfo);
            
            // Add labels
            node.append('text')
                .text(d => d.label.length > 20 ? d.label.substring(0, 20) + '...' : d.label)
                .attr('dy', 25);
            
            // Update simulation
            simulation.nodes(data.nodes)
                .on('tick', ticked);
            
            simulation.force('link')
                .links(data.links);
            
            if (physicsEnabled) {
                simulation.alpha(1).restart();
            }
            
            function ticked() {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                linkLabel
                    .attr('x', d => (d.source.x + d.target.x) / 2)
                    .attr('y', d => (d.source.y + d.target.y) / 2);
                
                node
                    .attr('transform', d => `translate(${d.x},${d.y})`);
            }
        }
        
        // Drag functions
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            if (!physicsEnabled) {
                d.fx = null;
                d.fy = null;
            }
        }
        
        // Show node information
        function showNodeInfo(event, d) {
            const info = document.getElementById('info');
            info.innerHTML = `
                <h4>Node Information</h4>
                <p><strong>Label:</strong> ${d.label}</p>
                <p><strong>Type:</strong> ${d.type}</p>
                <p><strong>Context:</strong> ${d.group}</p>
                <p><strong>ID:</strong> ${d.id}</p>
            `;
            info.style.display = 'block';
        }
        
        // Toggle physics simulation
        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            if (physicsEnabled) {
                simulation.alpha(1).restart();
            } else {
                simulation.stop();
            }
        }
        
        // Fit graph to screen
        function fitToScreen() {
            const bounds = g.node().getBBox();
            const width = window.innerWidth;
            const height = window.innerHeight;
            const midX = bounds.x + bounds.width / 2;
            const midY = bounds.y + bounds.height / 2;
            
            const scale = 0.9 / Math.max(bounds.width / width, bounds.height / height);
            const translate = [width / 2 - scale * midX, height / 2 - scale * midY];
            
            svg.transition()
                .duration(750)
                .call(d3.zoom().transform, d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale));
        }
        
        // Export graph data
        async function exportGraph(format) {
            const context = document.getElementById('contextFilter').value;
            const url = context ? 
                `${API_BASE}/export?format=${format}&context=${context}` : 
                `${API_BASE}/export?format=${format}`;
            
            try {
                const response = await fetch(url);
                const result = await response.json();
                
                if (result.error) {
                    throw new Error(result.error);
                }
                
                // Download the file
                const blob = new Blob([JSON.stringify(result.data, null, 2)], {type: 'application/json'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `semantic_graph_${format}_${Date.now()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
            } catch (err) {
                console.error('Error exporting graph:', err);
                alert(`Export failed: ${err.message}`);
            }
        }
        
        // Initialize on load
        window.addEventListener('load', () => {
            initGraph();
            loadGraph();
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            svg.attr('width', width).attr('height', height);
            simulation.force('center', d3.forceCenter(width / 2, height / 2));
            simulation.alpha(0.3).restart();
        });
    </script>
</body>
</html>
