version: "3.9"

###############################
#  NeuroSync Stand-alone Stack
#
#  This stack runs *only* the components needed for the
#  NeuroSync VTuber pipeline:
#    1. Local Blend-Shape API  (Flask)  → :5000
#    2. Player / LLM → Face     (Flask)  → :5001
#    3. NGINX-RTMP streaming server      → :1935 / :8080
#
#  Usage:
#    docker compose -f docker-compose.neurosync.yml up --build
#
#  Notes:
#  • Both "neurosync-api" and "neurosync-player" share the same
#    build context/image to avoid duplication.  We override the
#    entrypoint/command so each container only runs the required
#    service.
#  • GPU access is optional.  Uncomment the "deploy" section to
#    enable NVIDIA runtime if you have a compatible GPU.
###############################

services:
  neurosync-api:
    # Build the NeuroBridge image (PyTorch base + dependencies)
    build:
      context: .
      dockerfile: ./Dockerfile.neurosync
    image: neurosync-base:latest   # Tag image so the player service can reuse it
    container_name: neurosync_api
    entrypoint: ["python", "/app/NeuroBridge/NeuroSync_Local_API/neurosync_local_api.py"]
    ports:
      - "5000:5000"   # HTTP JSON API for blend-shape generation + SCB endpoints
    environment:
      # General Flask settings
      - FLASK_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      # Shared-Cognitive-Blackboard (SCB) – use in-memory store by default
      - USE_REDIS_SCB=false
      # Uncomment and set if you wish to secure the API
      # - NEUROSYNC_API_KEY=my-super-secret
    volumes:
      # Mount code for live-reload development (optional)
      - ./NeuroBridge:/app/NeuroBridge
    restart: unless-stopped
    networks:
      - neurosync_net
    # Uncomment this block to enable GPU access (NVIDIA Container Toolkit required)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1   # or "all"
    #           capabilities: [gpu]

  neurosync-player:
    image: neurosync-base:latest
    container_name: neurosync_player
    depends_on:
      - neurosync-api
    entrypoint: ["python", "/app/NeuroBridge/NeuroSync_Player/llm_to_face.py"]
    ports:
      - "5001:5001"   # HTTP endpoint that agent(s) call with text
    environment:
      - PLAYER_PORT=5001
      # Disable payment requirement so the worker stays open by default
      - VTUBER_PAYMENT_ENABLED=false
      # Allow player to call the local API service via Docker DNS
      - NEUROSYNC_API_URL=http://neurosync-api:5000
    volumes:
      - ./NeuroBridge:/app/NeuroBridge
    restart: unless-stopped
    networks:
      - neurosync_net
    # Uncomment for GPU access
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  nginx-rtmp:
    build:
      context: ./files_docker_rtmp/docker/rtmp
    container_name: nginx_rtmp
    ports:
      - "1935:1935"   # RTMP ingest
      - "8080:8080"   # HLS + status page & manifest
    volumes:
      - ./files_docker_rtmp/docker/rtmp/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks:
      - neurosync_net

# --------------------------------------------------------
# Networks & Volumes
# --------------------------------------------------------
networks:
  neurosync_net:
    driver: bridge
