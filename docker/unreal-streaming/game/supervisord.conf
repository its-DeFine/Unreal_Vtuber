[supervisord]
nodaemon=true
user=gameuser
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_RESOLUTION)s24 -ac +extension GLX +render -noreset
autorestart=true
user=gameuser
priority=1
environment=DISPLAY=":99"
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.err

[program:tcp_server]
command=/home/gameuser/tcp_server.sh
autorestart=true
user=gameuser
priority=2
stdout_logfile=/var/log/supervisor/tcp_server.log
stderr_logfile=/var/log/supervisor/tcp_server.err

[program:game]
command=/home/gameuser/start_game.sh
autorestart=true
user=gameuser
priority=10
environment=DISPLAY=":99",HOME="/home/gameuser"
stdout_logfile=/var/log/supervisor/game.log
stderr_logfile=/var/log/supervisor/game.err
startsecs=10
stopwaitsecs=30

[group:unreal]
programs=xvfb,tcp_server,game
priority=999