[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:signaling]
command=/bin/sh -c "HTTP_PORT=${SIGNALING_HTTP_PORT:-80} STREAMER_PORT=${SIGNALING_STREAMER_PORT:-8888} ENABLE_REST_API=${ENABLE_REST_API:-1} PUBLIC_IP=${PUBLIC_IP:-auto} STUN_SERVER=${STUN_SERVER:-stun.l.google.com:19302} /SignallingWebServer/SignallingWebServer/platform_scripts/bash/start.sh -- --sfu_port ''"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
startretries=3
startsecs=5

[program:runner]
directory=/opt/embody/runner
command=/bin/sh -c "exec uvicorn app:app --host 0.0.0.0 --port ${RUNNER_PORT:-9877}"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
startretries=3
startsecs=5

[program:recorder-control]
directory=/opt/embody/recorder
command=/bin/sh -c "exec python control_server.py"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stderr_logfile=/dev/fd/2
startretries=3
startsecs=5
