name: Orchestrator Health Tests

on:
  push:
    branches:
      - codex/wake-sleep-logic
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi starlette httpx docker requests
      - name: Run tests
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/orchestrator-health:$PYTHONPATH"
          pytest orchestrator-health/tests
