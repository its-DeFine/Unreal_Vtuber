name: Force Rebuild on Updates

on:
  push:
    branches:
      - main
      - BYOC
  pull_request:
    branches:
      - main
      - BYOC
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild with no cache'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  FORCE_REBUILD_ON_VTUBER_UPDATE: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      needs_rebuild: ${{ steps.check.outputs.needs_rebuild }}
      changed_files: ${{ steps.check.outputs.changed_files }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
          
      - name: Check for changes
        id: check
        run: |
          echo "Checking for changes that require rebuild..."
          
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || git ls-files)
          echo "Changed files: $CHANGED_FILES"
          
          # Check if any critical files changed
          NEEDS_REBUILD=false
          for file in $CHANGED_FILES; do
            if [[ "$file" == *"Dockerfile"* ]] || \
               [[ "$file" == *"docker-compose"* ]] || \
               [[ "$file" == *"requirements"* ]] || \
               [[ "$file" == *"package.json"* ]] || \
               [[ "$file" == *"NeuroBridge"* ]]; then
              NEEDS_REBUILD=true
              break
            fi
          done
          
          # Force rebuild if manually triggered
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             [[ "${{ github.event.inputs.force_rebuild }}" == "true" ]]; then
            NEEDS_REBUILD=true
          fi
          
          echo "needs_rebuild=$NEEDS_REBUILD" >> $GITHUB_OUTPUT
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  rebuild-containers:
    needs: detect-changes
    if: needs.detect-changes.outputs.needs_rebuild == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Force clean build
        run: |
          echo "🔨 Starting fresh rebuild of all VTuber containers..."
          
          # Clean any existing containers and images
          docker-compose -f docker-compose.byoc.yml down --rmi local -v || true
          
          # Build with no cache
          docker-compose -f docker-compose.byoc.yml build --no-cache --parallel
          
      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Tag and push images
          docker-compose -f docker-compose.byoc.yml config --services | while read service; do
            IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/vtuber-$service"
            docker tag ${service}:latest ${IMAGE_NAME}:latest
            docker tag ${service}:latest ${IMAGE_NAME}:${{ github.sha }}
            docker push ${IMAGE_NAME}:latest
            docker push ${IMAGE_NAME}:${{ github.sha }}
          done
          
      - name: Create deployment notification
        if: success()
        uses: actions/github-script@v6
        with:
          script: |
            const changedFiles = `${{ needs.detect-changes.outputs.changed_files }}`;
            const body = `## 🚀 Fresh Rebuild Completed
            
            **Trigger:** ${context.eventName}
            **Branch:** ${context.ref}
            **Commit:** ${context.sha.substring(0, 7)}
            
            ### Changed Files:
            \`\`\`
            ${changedFiles}
            \`\`\`
            
            ### Containers Rebuilt:
            - neurosync (with --no-cache)
            - All dependent services
            
            ### Next Steps:
            Deploy using: \`docker-compose -f docker-compose.byoc.yml pull && docker-compose -f docker-compose.byoc.yml up -d\`
            `;
            
            if (context.eventName === 'pull_request') {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }

  notify-skip:
    needs: detect-changes
    if: needs.detect-changes.outputs.needs_rebuild == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip notification
        run: |
          echo "ℹ️ No rebuild needed - no critical files changed"
          echo "Changed files: ${{ needs.detect-changes.outputs.changed_files }}"