name: Recorder Tests

on:
  push:
    branches:
      - feature/recorder-control
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio aiohttp
      - name: Run recorder tests
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE" pytest tools/recorder/tests
