global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'unified-vtuber-monitor'

scrape_configs:
  # Node Exporter - System metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service

  # GraphFlow Gateway
  - job_name: 'graphflow-gateway'
    static_configs:
      - targets: ['graphflow-stimuli-system-graphflow-gateway-1:9090']
    metrics_path: '/metrics'

  # VTuber System (S1)
  - job_name: 'vtuber-s1'
    static_configs:
      - targets: ['neurosync_s1:5001']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # AutoGen Agent
  - job_name: 'autogen-agent'
    static_configs:
      - targets: ['autogen_agent:8000']
    metrics_path: '/metrics'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Ollama
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama-exporter:9122']

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'

# Alerting rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []