global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vtuber-unified-cluster'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # ===== CORE SERVICES =====
  
  # NeuroSync S1 - VTuber Avatar
  - job_name: 'neurosync-s1'
    static_configs:
      - targets: ['neurosync:5001']
    metrics_path: '/metrics'
    scrape_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'neurosync-s1'

  # AutoGen Multi-Agent System
  - job_name: 'autogen-agent'
    static_configs:
      - targets: ['autogen_agent:8000']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'autogen-main'

  # GraphFlow Gateway
  - job_name: 'graphflow-gateway'
    static_configs:
      - targets: ['graphflow_gateway:9090']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'graphflow-main'

  # ===== DATA STORES =====

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis-scb'

  # PostgreSQL - AutoGen
  - job_name: 'postgres-autogen'
    static_configs:
      - targets: ['postgres-exporter-autogen:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres-autogen'

  # PostgreSQL - GraphFlow
  - job_name: 'postgres-graphflow'
    static_configs:
      - targets: ['postgres-exporter-graphflow:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres-graphflow'

  # Neo4j - Graph Database
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:2004']  # Neo4j metrics endpoint
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'neo4j-semantic'

  # ===== INFRASTRUCTURE =====

  # Ollama LLM
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama-exporter:9122']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ollama-llm'

  # NGINX RTMP
  - job_name: 'nginx-rtmp'
    static_configs:
      - targets: ['nginx-exporter:9113']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'nginx-rtmp'

  # ===== MONITORING INFRASTRUCTURE =====

  # Node Exporter - System Metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'host-system'

  # cAdvisor - Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [container_name]
        target_label: container

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: '/metrics'