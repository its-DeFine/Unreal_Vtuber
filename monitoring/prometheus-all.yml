global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'vtuber-cluster'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # ===== CORE SERVICES =====
  
  # NeuroSync S1 - VTuber Avatar
  - job_name: 'neurosync-s1'
    static_configs:
      - targets: ['neurosync_s1:5001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # AutoGen Multi-Agent System
  - job_name: 'autogen-agent'
    static_configs:
      - targets: ['autogen_agent:8000']
    metrics_path: '/metrics'

  # GraphFlow Gateway
  - job_name: 'graphflow-gateway'
    static_configs:
      - targets: ['graphflow_gateway:9090']
    metrics_path: '/metrics'

  # ===== DATA STORES =====

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']

  # PostgreSQL - AutoGen
  - job_name: 'postgres-autogen'
    static_configs:
      - targets: ['postgres_exporter_autogen:9187']

  # PostgreSQL - GraphFlow
  - job_name: 'postgres-graphflow'
    static_configs:
      - targets: ['postgres_exporter_graphflow:9187']

  # ===== INFRASTRUCTURE =====

  # Ollama LLM
  - job_name: 'ollama'
    static_configs:
      - targets: ['ollama_exporter:9122']

  # NGINX RTMP
  - job_name: 'nginx-rtmp'
    static_configs:
      - targets: ['nginx_exporter:9113']

  # ===== MONITORING INFRASTRUCTURE =====

  # Node Exporter - System Metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  # cAdvisor - Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [name]
        target_label: container

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: '/metrics'