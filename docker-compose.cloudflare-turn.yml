# Cloudflare TURN overlay — adds peer_options.json mount and --peer_options_file flag
# to the signaling server, replacing the local coturn relay with Cloudflare's anycast TURN.
#
# Usage:
#   1. Run: ./scripts/generate_cf_turn_credentials.sh
#   2. Start: docker compose -f docker-compose.unreal.yml -f docker-compose.cloudflare-turn.yml up -d
#
# Prerequisites:
#   - CF_TURN_TOKEN_ID and CF_TURN_API_TOKEN set in .env or .env.cloudflare-turn
#   - peer_options.json generated by the script above

services:
  unreal-signaling:
    volumes:
      - ./peer_options.json:/opt/peer_options.json:ro
    environment:
      SIGNALING_EXTRA_ARGS: "${SIGNALING_EXTRA_ARGS:-} ${SIGNALING_MATCHMAKER_ARGS:-} --peer_options_file=/opt/peer_options.json"
