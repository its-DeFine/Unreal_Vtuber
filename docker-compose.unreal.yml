version: "3.9"

services:
  # ===========================================
  # UNREAL ENGINE PIXEL STREAMING SERVICES
  # ===========================================

  # TURN server to relay WebRTC traffic when direct peer connections fail
  turn-server:
    image: instrumentisto/coturn
    container_name: vtuber-turn-server
    restart: unless-stopped
    env_file:
      - .env.turn
    entrypoint: ['/bin/sh', '-c']
    command: |
      turnserver \
        --log-file=stdout \
        --fingerprint \
        --lt-cred-mech \
        --no-cli \
        --no-tls \
        --no-dtls \
        --realm="$$TURN_REALM" \
        --user="$$TURN_USER:$$TURN_PASS" \
        --listening-port="$$TURN_PORT" \
        --listening-ip=0.0.0.0 \
        --external-ip="$$TURN_EXTERNAL_IP" \
        --min-port="$$TURN_MIN_PORT" \
        --max-port="$$TURN_MAX_PORT"
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    networks:
      - vtuber_network

  # Signaling Server - WebRTC signaling and web interface
  unreal-signaling:
    build:
      context: ./docker/pixel-streaming/signaling
    image: its-define/unreal-signaling:local
    container_name: vtuber-unreal-signaling
    restart: unless-stopped
    depends_on:
      - turn-server
    env_file:
      - .env.turn
    ports:
      - "8080:8080"     # HTTP web interface
      - "8888:8888"     # Streamer port
      - "8889:8889"     # SFU port
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-auto}
      - HTTP_PORT=8080
      - STREAMER_PORT=8888
      - SFU_PORT=8889
      - STUN_SERVER=${STUN_SERVER:-stun.l.google.com:19302}
      - ENABLE_REST_API=${ENABLE_REST_API:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vtuber_network
    ulimits:
      nofile:
        soft: ${HOST_ULIMIT_NOFILE:-1048576}
        hard: ${HOST_ULIMIT_NOFILE:-1048576}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Embody Game - Headless Unreal Engine with Pixel Streaming
  unreal-game:
    image: ghcr.io/its-define/unreal_vtuber/embody-ue-ps:latest
    container_name: vtuber-unreal-game
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "7777:7777"
    depends_on:
      unreal-signaling:
        condition: service_healthy
    environment:
      - PIXEL_STREAMING_URL=ws://unreal-signaling:8888
      - HOST_ULIMIT_NOFILE=${HOST_ULIMIT_NOFILE:-1048576}
      - HOST_LIB_PATHS=/host-libs/usr/lib/x86_64-linux-gnu:/host-libs/lib/x86_64-linux-gnu:/host-libs/lib64:/host-libs/usr/lib64:/host-libs/usr/lib/nvidia
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - UNREAL_RES_X=${UNREAL_RES_X:-1920}
      - UNREAL_RES_Y=${UNREAL_RES_Y:-1080}
      - UNREAL_FPS=${UNREAL_FPS:-60}
      - EMBODY_EXTRA_ARGS=-PixelStreamingIP=unreal-signaling -PixelStreamingPort=8888 -Windowed -ResX=${UNREAL_RES_X:-1920} -ResY=${UNREAL_RES_Y:-1080} -ForceRes -AllowPixelStreamingCommands -PixelStreamingEncoderRateControl=VBR -PixelStreamingEncoderTargetBitrate=5000000 -PixelStreamingEncoderMaxBitrate=10000000 -PixelStreamingWebRTCFps=${UNREAL_FPS:-60} -PixelStreamingWebRTCDisableReceiveAudio -PixelStreamingWebRTCDisableTransmitAudio -TCPServerEnabled=true -TCPServerPort=7777 -TCPServerBindAddress=0.0.0.0 -dx12 -sm6 -NoAudio -NoSound -NullRHI -game
    volumes:
      - /usr/lib/x86_64-linux-gnu:/host-libs/usr/lib/x86_64-linux-gnu:ro
      - /lib/x86_64-linux-gnu:/host-libs/lib/x86_64-linux-gnu:ro
      - /lib64:/host-libs/lib64:ro
      - /usr/lib64:/host-libs/usr/lib64:ro
      - /usr/lib/nvidia:/host-libs/usr/lib/nvidia:ro
      - /usr/share/vulkan:/host-libs/usr/share/vulkan:ro
      - /etc/vulkan:/host-libs/etc/vulkan:ro
      - /usr/share/glvnd:/host-libs/usr/share/glvnd:ro
    networks:
      - vtuber_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Override neurosync service to communicate with in-network Unreal game
  neurosync_s1:
    environment:
      - UNREAL_TCP_HOST=unreal-game
      - UNREAL_TCP_PORT=7777

networks:
  vtuber_network:
    external: true
    name: vtuber_network
