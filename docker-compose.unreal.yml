
services:
  # ===========================================
  # UNREAL ENGINE PIXEL STREAMING SERVICES
  # ===========================================

  # TURN server to relay WebRTC traffic when direct peer connections fail
  turn-server:
    image: ghcr.io/its-define/unreal_vtuber/embody-turn-server:latest
    container_name: vtuber-turn-server
    restart: unless-stopped
    env_file:
      - .env.turn
    entrypoint: ['/bin/sh', '-c']
    command: |
      turnserver \
        --log-file=stdout \
        --fingerprint \
        --lt-cred-mech \
        --no-cli \
        --no-tls \
        --no-dtls \
        --realm="$$TURN_REALM" \
        --user="$$TURN_USER:$$TURN_PASS" \
        --listening-port="$$TURN_PORT" \
        --listening-ip=0.0.0.0 \
        --external-ip="$$TURN_EXTERNAL_IP" \
        --min-port="$$TURN_MIN_PORT" \
        --max-port="$$TURN_MAX_PORT"
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    networks:
      - vtuber_network

  # Signaling Server - WebRTC signaling (UI served from the edge/gateway)
  unreal-signaling:
    image: ghcr.io/its-define/unreal_vtuber/embody-signaling:latest
    container_name: vtuber-unreal-signaling
    restart: unless-stopped
    depends_on:
      - turn-server
    env_file:
      - .env.turn
    ports:
      - "8080:80"       # HTTP web interface
      - "8888:8888"     # Streamer port
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-auto}
      HTTP_PORT: "8080"
      STREAMER_PORT: "8888"
      SFU_PORT: "8889"
      STUN_SERVER: ${STUN_SERVER:-stun.l.google.com:19302}
      # Optional additional Wilbur/start.sh CLI flags (example: matchmaker registration).
      SIGNALING_EXTRA_ARGS: "${SIGNALING_EXTRA_ARGS:-} ${SIGNALING_MATCHMAKER_ARGS:-}"
      ENABLE_REST_API: ${ENABLE_REST_API:-0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vtuber_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Embody Game - Headless Unreal Engine with Pixel Streaming
  unreal-game:
    image: ghcr.io/its-define/unreal_vtuber/embody-ue-ps:latest
    container_name: vtuber-unreal-game
    restart: unless-stopped
    runtime: nvidia
    ulimits:
      nofile:
        soft: ${HOST_ULIMIT_NOFILE:-1040}
        hard: ${HOST_ULIMIT_NOFILE:-1040}
    ports:
      - "7777:7777"
      - "9877:9877"
    depends_on:
      unreal-signaling:
        condition: service_healthy
    environment:
      - PIXEL_STREAMING_URL=ws://unreal-signaling:8888
      - HOST_ULIMIT_NOFILE=1040
      - ULIMIT_NOFILE=1040
      - HOST_LIB_PATHS=/host-libs/usr/lib/x86_64-linux-gnu:/host-libs/lib/x86_64-linux-gnu:/host-libs/lib64:/host-libs/usr/lib64:/host-libs/usr/lib/nvidia
      - EMBODY_EXTRA_ARGS=-ForceRes -ResX=1920 -ResY=1080 -PixelStreamingAllowCodecNames=H264 -PixelStreamingDisableVP8 -PixelStreamingDisableVP9
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - /usr/lib/x86_64-linux-gnu:/host-libs/usr/lib/x86_64-linux-gnu:ro
      - /lib/x86_64-linux-gnu:/host-libs/lib/x86_64-linux-gnu:ro
      - /lib64:/host-libs/lib64:ro
      - /usr/lib64:/host-libs/usr/lib64:ro
      - /usr/lib/nvidia:/host-libs/usr/lib/nvidia:ro
      - /usr/share/vulkan:/host-libs/usr/share/vulkan:ro
      - /etc/vulkan:/host-libs/etc/vulkan:ro
      - /usr/share/glvnd:/host-libs/usr/share/glvnd:ro
      - ./pixel-streaming/config/ConsoleVariables.ini:/opt/embody/Embody/Saved/Config/LinuxNoEditor/ConsoleVariables.ini:ro
      - ./pixel-streaming/config/GameUserSettings.ini:/opt/embody/Embody/Saved/Config/LinuxNoEditor/GameUserSettings.ini:ro
      - ${VTUBER_SESSION_DIR:-/home/ubuntu/vtuber_sessions}:/opt/embody/sessions
    networks:
      - vtuber_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vtuber-script-runner:
    image: ghcr.io/its-define/unreal_vtuber/vtuber-script-runner:${EMBODY_SERVICE_IMAGE_TAG:-latest}
    container_name: vtuber-script-runner
    network_mode: "service:unreal-game"
    environment:
      - VTUBER_SESSION_ROOT=/opt/embody/sessions
      - VTUBER_TCP_HOST=${VTUBER_TCP_HOST:-127.0.0.1}
      - VTUBER_TCP_PORT=7777
      - VTUBER_ALLOWED_ADDRESSES=${VTUBER_ALLOWED_ADDRESSES:-127.0.0.1,::1,172.17.0.1,172.18.0.1}
    volumes:
      - ${VTUBER_SESSION_DIR:-/home/ubuntu/vtuber_sessions}:/opt/embody/sessions
    restart: unless-stopped
    depends_on:
      - unreal-game

  vtuber-watchdog:
    image: ghcr.io/its-define/unreal_vtuber/vtuber-watchdog:${EMBODY_SERVICE_IMAGE_TAG:-latest}
    container_name: vtuber-watchdog
    restart: unless-stopped
    depends_on:
      - unreal-game
    environment:
      - WATCHDOG_COMPOSE_FILE=/workspace/docker-compose.unreal.yml
      - WATCHDOG_RUNNER_SERVICE=vtuber-script-runner
      - WATCHDOG_GAME_CONTAINER=vtuber-unreal-game
      - WATCHDOG_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-unreal_vtuber}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.unreal.yml:/workspace/docker-compose.unreal.yml:ro
      - ./.env:/workspace/.env:ro
      - ./.env.turn:/workspace/.env.turn:ro
      - /var/lib/vtuber/power-state:/var/lib/vtuber/power-state:ro

  orchestrator-registration:
    image: ghcr.io/its-define/unreal_vtuber/orchestrator-registration:${EMBODY_SERVICE_IMAGE_TAG:-latest}
    container_name: vtuber-orchestrator-registration
    depends_on:
      - unreal-game
    env_file:
      - .env
    environment:
      # Point to the standalone payments backend maintained outside this repo
      - PAYMENTS_API_URL=${PAYMENTS_API_URL:-http://payments-backend:8081}
      - ORCHESTRATOR_REGISTRATION_DELAY=${ORCHESTRATOR_REGISTRATION_DELAY:-10}
    entrypoint:
      - /bin/sh
      - -lc
      - "sleep ${ORCHESTRATOR_REGISTRATION_DELAY:-10} && python3 /app/register_orchestrator.py"
    restart: "no"
    networks:
      - vtuber_network

  orchestrator-health:
    image: ghcr.io/its-define/unreal_vtuber/orchestrator-health:${EMBODY_SERVICE_IMAGE_TAG:-latest}
    container_name: vtuber-orchestrator-health
    command: ["python", "-m", "orchestrator_health.remote_health_service"]
    env_file:
      - .env
    environment:
      - MONITORED_SERVICES=${MONITORED_SERVICES:-vtuber-unreal-game,vtuber-unreal-signaling,vtuber-turn-server}
      # Prevent a slow/broken self-call to the public health URL when host firewall allowlists are enabled.
      # Payments uses ORCHESTRATOR_HEALTH_URL from `.env`; the orchestrator-health container should always
      # inspect local docker state instead.
      - ORCHESTRATOR_HEALTH_URL=
      - ORCHESTRATOR_HEALTH_PORT=9090
      - POWER_ALLOWED_IPS=${POWER_ALLOWED_IPS:-}
      - POWER_KEEP_RUNNING_SERVICES=${POWER_KEEP_RUNNING_SERVICES-orchestrator-edge-rotator}
      - POWER_ALLOWED_IPS_FILE=${EDGE_POWER_ALLOWED_IPS_FILE-/var/lib/vtuber/power-state/power_allowed_ips.txt}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/vtuber/power-state:/var/lib/vtuber/power-state
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - vtuber_network

  orchestrator-edge-rotator:
    image: ghcr.io/its-define/unreal_vtuber/orchestrator-edge-rotator:${EMBODY_SERVICE_IMAGE_TAG:-latest}
    container_name: vtuber-orchestrator-edge-rotator
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    env_file:
      - .env
    environment:
      - EDGE_CONFIG_URL=${EDGE_CONFIG_URL:-}
      - EDGE_CONFIG_TOKEN=${EDGE_CONFIG_TOKEN:-}
      - EDGE_POLL_INTERVAL_SECONDS=${EDGE_POLL_INTERVAL_SECONDS:-15}
      - EDGE_PROJECT_DIR=${EDGE_PROJECT_DIR:-/home/ubuntu/Unreal_Vtuber}
      - EDGE_ALLOW_PORTS=${EDGE_ALLOW_PORTS:-}
      - EDGE_ENFORCE_EXCLUSIVE=${EDGE_ENFORCE_EXCLUSIVE:-1}
      - EDGE_SIGNALING_PUBLIC_PORT=${EDGE_SIGNALING_PUBLIC_PORT:-8080}
      - EDGE_MATCHMAKER_DEFAULT_PORT=${EDGE_MATCHMAKER_DEFAULT_PORT:-8889}
      - EDGE_UPDATE_TURN=${EDGE_UPDATE_TURN:-0}
      - EDGE_WAKE_SETTLE_SECONDS=${EDGE_WAKE_SETTLE_SECONDS:-60}
      - EDGE_FIREWALL_EXTRA_CIDRS=${EDGE_FIREWALL_EXTRA_CIDRS:-}
      - EDGE_POWER_ALLOWED_IPS_FILE=${EDGE_POWER_ALLOWED_IPS_FILE-/var/lib/vtuber/power-state/power_allowed_ips.txt}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/vtuber/power-state:/var/lib/vtuber/power-state
      - ${EDGE_PROJECT_DIR:-/home/ubuntu/Unreal_Vtuber}:${EDGE_PROJECT_DIR:-/home/ubuntu/Unreal_Vtuber}

  vtuber-auto-updater:
    image: containrrr/watchtower:1.7.1
    container_name: vtuber-auto-updater
    restart: unless-stopped
    depends_on:
      - unreal-game
    environment:
      # Watchtower embeds an older Docker client; force a modern API version to match the host daemon.
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.44}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      [
        "--interval",
        "${WATCHTOWER_INTERVAL:-900}",
        "--cleanup",
        "--include-restarting",
        "vtuber-turn-server",
        "vtuber-unreal-signaling",
        "vtuber-script-runner",
        "vtuber-recorder-control",
        "vtuber-orchestrator-edge-rotator",
        "vtuber-orchestrator-health",
        "vtuber-watchdog",
      ]

  recorder-control:
    image: ghcr.io/its-define/unreal_vtuber/recorder-control:${EMBODY_SERVICE_IMAGE_TAG:-latest}
    container_name: vtuber-recorder-control
    depends_on:
      - unreal-signaling
    env_file:
      - .env.turn
    environment:
      - RECORDER_CTRL_PORT=8889
      - RECORDER_SIGNALING_URL=${RECORDER_SIGNALING_URL:-ws://vtuber-unreal-signaling:80}
      - RECORDER_OUTPUT_DIR=/recordings
      - PY_RECORDER_PATH=/opt/embody/recorder/gs_webrtc_recorder.py
      - RECORDER_STREAMER_WAIT_SECONDS=${RECORDER_STREAMER_WAIT_SECONDS:-30}
      - RECORDER_STREAMER_POLL_SECONDS=${RECORDER_STREAMER_POLL_SECONDS:-2}
      - RECORDER_AV_WAIT_SECONDS=${RECORDER_AV_WAIT_SECONDS:-3}
      - VTUBER_ALLOWED_ADDRESSES=${VTUBER_ALLOWED_ADDRESSES:-127.0.0.1,::1,172.17.0.1,172.18.0.1}
      # Recorder connects on the docker network; default TURN host is the local coturn service.
      - RECORDER_TURN_HOST=${RECORDER_TURN_HOST:-vtuber-turn-server}
      - RECORDINGS_API_TOKEN=${RECORDINGS_API_TOKEN:-}
    volumes:
      - ${VTUBER_RECORDINGS_DIR:-/recordings}:/recordings
    command: ["python3", "/opt/embody/recorder/control_server.py"]
    restart: unless-stopped
    networks:
      - vtuber_network
    ports:
      - "8889:8889"

networks:
  vtuber_network:
    external: true
    name: vtuber_network
