
services:
  # ===========================================
  # UNREAL ENGINE PIXEL STREAMING SERVICES
  # ===========================================

  # TURN server to relay WebRTC traffic when direct peer connections fail
  turn-server:
    image: ghcr.io/its-define/unreal_vtuber/embody-turn-server:latest
    container_name: vtuber-turn-server
    restart: unless-stopped
    env_file:
      - .env.turn
    entrypoint: ['/bin/sh', '-c']
    command: |
      turnserver \
        --log-file=stdout \
        --fingerprint \
        --lt-cred-mech \
        --no-cli \
        --no-tls \
        --no-dtls \
        --realm="$$TURN_REALM" \
        --user="$$TURN_USER:$$TURN_PASS" \
        --listening-port="$$TURN_PORT" \
        --listening-ip=0.0.0.0 \
        --external-ip="$$TURN_EXTERNAL_IP" \
        --min-port="$$TURN_MIN_PORT" \
        --max-port="$$TURN_MAX_PORT"
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    networks:
      - vtuber_network

  # Embody app (monolith: signaling + runner + recorder-control)
  embody-app:
    build:
      context: .
      dockerfile: docker/embody-app/Dockerfile
    container_name: vtuber-embody-app
    restart: unless-stopped
    depends_on:
      - turn-server
    env_file:
      - .env.turn
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-auto}
      SIGNALING_HTTP_PORT: 80
      SIGNALING_STREAMER_PORT: 8888
      STUN_SERVER: ${STUN_SERVER:-stun.l.google.com:19302}
      # Game listens on loopback; route via bridge gateway (docker-proxy maps 7777 to loopback).
      VTUBER_TCP_HOST: ${VTUBER_TCP_HOST:-172.18.0.1}
      VTUBER_TCP_PORT: ${VTUBER_TCP_PORT:-7777}
      VTUBER_SESSION_ROOT: ${VTUBER_SESSION_DIR:-/home/ubuntu/vtuber_sessions}
      VTUBER_ALLOWED_ADDRESSES: ${VTUBER_ALLOWED_ADDRESSES:-127.0.0.1,::1,172.18.0.1}
      RECORDER_CTRL_PORT: 8890
      RECORDER_OUTPUT_DIR: /recordings
      RECORDER_SIGNALING_URL: ${RECORDER_SIGNALING_URL:-ws://localhost:80}
      RUNNER_URL: ${RUNNER_URL:-http://127.0.0.1:9877}
      PLANNER_URL: ${PLANNER_URL:-}
      PLAN_SPEECH_SPACING_MS: ${PLAN_SPEECH_SPACING_MS:-2000}
      RUNNER_POLL_SECONDS: ${RUNNER_POLL_SECONDS:-120}
      RECORDINGS_API_TOKEN: ${RECORDINGS_API_TOKEN:-}
      ENABLE_REST_API: ${ENABLE_REST_API:-1}
    ports:
      - "8080:80"       # HTTP web interface
      - "8888:8888"     # Streamer port
      - "8889:8890"     # Recorder/API (exposed on 8889)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ${VTUBER_SESSION_DIR:-/home/ubuntu/vtuber_sessions}:/opt/embody/sessions
      - /recordings:/recordings
      - ./pixel-streaming/config/ConsoleVariables.ini:/opt/embody/Embody/Saved/Config/LinuxNoEditor/ConsoleVariables.ini:ro
      - ./pixel-streaming/config/GameUserSettings.ini:/opt/embody/Embody/Saved/Config/LinuxNoEditor/GameUserSettings.ini:ro
    networks:
      vtuber_network:
        aliases:
          - unreal-signaling
          - vtuber-script-runner

  # Embody Game - Headless Unreal Engine with Pixel Streaming
  unreal-game:
    image: ghcr.io/its-define/unreal_vtuber/embody-ue-ps:2025-10-27-ue55
    container_name: vtuber-unreal-game
    restart: unless-stopped
    runtime: nvidia
    ulimits:
      nofile:
        soft: ${HOST_ULIMIT_NOFILE:-1040}
        hard: ${HOST_ULIMIT_NOFILE:-1040}
    ports:
      - "7777:7777"
      - "9877:9877"
    depends_on:
      embody-app:
        condition: service_healthy
    environment:
      - PIXEL_STREAMING_URL=ws://unreal-signaling:8888
      - HOST_ULIMIT_NOFILE=1040
      - ULIMIT_NOFILE=1040
      - HOST_LIB_PATHS=/host-libs/usr/lib/x86_64-linux-gnu:/host-libs/lib/x86_64-linux-gnu:/host-libs/lib64:/host-libs/usr/lib64:/host-libs/usr/lib/nvidia
      - EMBODY_EXTRA_ARGS=-ForceRes -ResX=1920 -ResY=1080 -PixelStreamingAllowCodecNames=H264 -PixelStreamingDisableVP8 -PixelStreamingDisableVP9
      - NVIDIA_DRIVER_CAPABILITIES=${NVIDIA_DRIVER_CAPABILITIES:-all}
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - /usr/lib/x86_64-linux-gnu:/host-libs/usr/lib/x86_64-linux-gnu:ro
      - /lib/x86_64-linux-gnu:/host-libs/lib/x86_64-linux-gnu:ro
      - /lib64:/host-libs/lib64:ro
      - /usr/lib64:/host-libs/usr/lib64:ro
      - /usr/lib/nvidia:/host-libs/usr/lib/nvidia:ro
      - /usr/share/vulkan:/host-libs/usr/share/vulkan:ro
      - /etc/vulkan:/host-libs/etc/vulkan:ro
      - /usr/share/glvnd:/host-libs/usr/share/glvnd:ro
      - ./pixel-streaming/config/ConsoleVariables.ini:/opt/embody/Embody/Saved/Config/LinuxNoEditor/ConsoleVariables.ini:ro
      - ./pixel-streaming/config/GameUserSettings.ini:/opt/embody/Embody/Saved/Config/LinuxNoEditor/GameUserSettings.ini:ro
      - ${VTUBER_SESSION_DIR:-/home/ubuntu/vtuber_sessions}:/opt/embody/sessions
    networks:
      - vtuber_network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  vtuber-watchdog:
    build:
      context: .
      dockerfile: docker/watchdog/Dockerfile
    container_name: vtuber-watchdog
    restart: unless-stopped
    depends_on:
      - unreal-game
    environment:
      - WATCHDOG_COMPOSE_FILE=/workspace/docker-compose.unreal.yml
      - WATCHDOG_RUNNER_SERVICE=vtuber-embody-app
      - WATCHDOG_GAME_CONTAINER=vtuber-unreal-game
      - WATCHDOG_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-unreal_vtuber}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace:ro
      - /var/lib/vtuber/power-state:/var/lib/vtuber/power-state:ro

  orchestrator-registration:
    image: python:3.11-slim
    container_name: vtuber-orchestrator-registration
    depends_on:
      - unreal-game
    env_file:
      - .env
    environment:
      # Point to the standalone payments backend maintained outside this repo
      - PAYMENTS_API_URL=${PAYMENTS_API_URL:-http://payments-backend:8081}
      - ORCHESTRATOR_REGISTRATION_DELAY=${ORCHESTRATOR_REGISTRATION_DELAY:-10}
    volumes:
      - .:/workspace:ro
    working_dir: /workspace
    entrypoint:
      - bash
      - -lc
      - "sleep ${ORCHESTRATOR_REGISTRATION_DELAY:-10} && python3 scripts/register_orchestrator.py"
    restart: "no"
    networks:
      - vtuber_network

  orchestrator-health:
    build:
      context: ./orchestrator-health
      dockerfile: Dockerfile
    command: ["python", "-m", "orchestrator_health.remote_health_service"]
    environment:
      - MONITORED_SERVICES=${MONITORED_SERVICES:-vtuber-unreal-game,vtuber-embody-app,vtuber-turn-server}
      - ORCHESTRATOR_HEALTH_PORT=9090
      - POWER_ALLOWED_IPS=${POWER_ALLOWED_IPS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/vtuber/power-state:/var/lib/vtuber/power-state
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - vtuber_network

  vtuber-auto-updater:
    image: containrrr/watchtower:1.7.1
    container_name: vtuber-auto-updater
    restart: unless-stopped
    depends_on:
      - unreal-game
    environment:
      # Watchtower embeds an older Docker client; force a modern API version to match the host daemon.
      - DOCKER_API_VERSION=${DOCKER_API_VERSION:-1.44}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      [
        "--interval",
        "${WATCHTOWER_INTERVAL:-900}",
        "--cleanup",
        "--include-restarting",
        "--rolling-restart",
        "vtuber-turn-server",
        "vtuber-embody-app",
        "vtuber-unreal-game",
      ]

networks:
  vtuber_network:
    external: true
    name: vtuber_network
