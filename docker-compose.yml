
services:
  # ===========================================
  # CORE VTUBER SERVICES
  # ===========================================
  
  # NeuroSync S1 - VTuber Avatar System
  neurosync_s1:
    mem_limit: 12g
    build:
      context: docker-vtuber
      dockerfile: ./app/AVATAR/NeuroBridge/dockerfile
      no_cache: true
    container_name: neurosync_s1
    command: [/app/entrypoint_bridge.sh]
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - FLASK_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=*
      - PLAYER_PORT=5001
      - USE_REDIS_SCB=true
      - REDIS_URL=redis://redis_scb:6379/0
      - LLM_PROVIDER=ollama
      - USE_OLLAMA_TEXT_MODELS=true
      - OLLAMA_HOST=http://vtuber-ollama:11434
      - OLLAMA_API_ENDPOINT=http://vtuber-ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OPENAI_MODEL=gpt-4o
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - VTUBER_PAYMENT_ENABLED=false
      - ORCHESTRATOR_VERSION=reactive
      - AUTONOMOUS_ORCHESTRATION_ENABLED=false
      - AUTONOMOUS_SPEECH_ENABLED=false
      - AUTONOMOUS_CONTENT_ENABLED=false
      - AUTONOMOUS_ENVIRONMENT_ENABLED=false
      - AUTO_INTERRUPT_ENABLED=false
      - SIMPLE_SPEECH_ENABLED=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - vtuber_network
    volumes:
      - ./docker-vtuber/app/AVATAR/NeuroBridge:/app/NeuroBridge
    env_file:
      - .env
    depends_on:
      # - redis_scb (using external Redis)
      - vtuber-ollama
      - kokoro_tts
    restart: unless-stopped

  # AutoGen Multi-Agent System (S2)
  autogen_agent:
    build:
      context: ./docker-vtuber/app/CORE/autogen-agent
      dockerfile: Dockerfile
    container_name: autogen_agent
    command: sh -c "pip install 'neo4j>=5.0.0' 'fastembed>=0.4.0' && python -m autogen_agent.simplified_main"
    volumes:
      - ./docker-vtuber/app/CORE/autogen-agent/autogen_agent:/app/autogen_agent
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@autogen_postgres:5432/autonomous_agent
      - USE_COGNITIVE_ENHANCEMENT=true
      - USE_AUTOGEN_LLM=true
      - STANDALONE_MODE=true
      - LOOP_INTERVAL=30
      - LOG_LEVEL=INFO
      - PORT=8000
      - OLLAMA_HOST=http://vtuber-ollama:11434
      - USE_OLLAMA=true
      - OLLAMA_MODEL=llama3.2:3b
      - VTUBER_ENDPOINT_URL=http://neurosync_s1:5001
      - VTUBER_ENDPOINT=http://neurosync_s1:5001
      - S1_AVATAR_ENDPOINT=http://neurosync_s1:5001
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
      - NEO4J_URI=bolt://autogen_neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - LLM_PROVIDER=ollama
      - LLM_MODEL=llama3.1
      - LLM_API_KEY=ollama
      - LLM_ENDPOINT=http://vtuber-ollama:11434/v1
      - LLM_TEMPERATURE=0.1
      - LLM_MAX_TOKENS=2048
      - INSTRUCTOR_MODE=json_mode
      - INSTRUCTOR_MAX_RETRIES=1
      - DARWIN_GODEL_REAL_MODIFICATIONS=true
      - DARWIN_GODEL_REQUIRE_APPROVAL=false
      - DARWIN_GODEL_PERFORMANCE_THRESHOLD=10
      - DARWIN_GODEL_BACKUP_RETENTION_DAYS=30
      - DARWIN_GODEL_MAX_MODIFICATIONS_PER_CYCLE=3
      - MAX_CONSECUTIVE_AUTO_REPLY=10
      - MAX_ROUNDS=20
      - ENABLE_CONTINUOUS_EVOLUTION=true
      - STATISTICS_PERSISTENCE_ENABLED=true
      - STATISTICS_RETENTION_DAYS=90
      - STATISTICS_BATCH_SIZE=100
      - CONVERSATION_STORAGE_ENABLED=true
      - REDIS_SCB_URL=redis://redis_scb:6379/0
      # Central Manager Integration
      - CENTRAL_MANAGER_URL=${CENTRAL_MANAGER_URL:-http://86.106.138.188:8010}
      - CENTRAL_MANAGER_TOKEN=${CENTRAL_MANAGER_TOKEN}
      - AGENT_REGISTRATION_ENABLED=true
      - ORCHESTRATOR_NAME=vtuber-autonomy-main
    env_file:
      - .env
    ports:
      - "8200:8000"
    networks:
      - vtuber_network
    depends_on:
      - autogen_postgres
      - autogen_neo4j
      - vtuber-ollama
    restart: unless-stopped

  # SCB Gateway Service
  scb_gateway:
    build: ./docker-vtuber/app/CORE/autogen-agent/scb_gateway
    container_name: scb_gateway
    ports:
      - "8300:8300"
    environment:
      - REDIS_URL=redis://redis_scb:6379/0
      - LOG_LEVEL=INFO
    networks:
      - vtuber_network
    depends_on:
      - redis_scb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for SCB (Semantic Communication Bus)
  redis_scb:
    image: redis:7-alpine
    container_name: redis_scb
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vtuber_network
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kokoro TTS - Local Neural TTS Server
  kokoro_tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro_tts
    ports:
      - "8880:8880"
    environment:
      - KOKORO_HOST=0.0.0.0
      - KOKORO_PORT=8880
    networks:
      - vtuber_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Ollama Model Loader - ensures models are loaded for AutoGen
  ollama_loader:
    image: curlimages/curl:latest
    container_name: ollama_loader
    depends_on:
      - vtuber-ollama
    networks:
      - vtuber_network
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama to be ready...' &&
        sleep 10 &&
        echo 'Pulling fast models for optimized performance...' &&
        curl -X POST http://vtuber-ollama:11434/api/pull -d '{\"name\": \"llama3.2:3b\"}' &&
        curl -X POST http://vtuber-ollama:11434/api/pull -d '{\"name\": \"tinyllama:latest\"}' &&
        curl -X POST http://vtuber-ollama:11434/api/pull -d '{\"name\": \"phi-2:latest\"}' &&
        echo 'Pulling nomic-embed-text model for embeddings...' &&
        curl -X POST http://vtuber-ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text:latest\"}' &&
        echo 'Models pull initiated' &&
        sleep 60 &&
        echo 'Loading models into memory...' &&
        curl -X POST http://vtuber-ollama:11434/api/generate -d '{\"model\": \"llama3.2:3b\", \"prompt\": \"Hello\", \"stream\": false}' &&
        curl -X POST http://vtuber-ollama:11434/api/generate -d '{\"model\": \"tinyllama:latest\", \"prompt\": \"Hi\", \"stream\": false}' &&
        echo 'Models loaded successfully'
      "
    restart: "no"

  # Orchestrator - Lightweight routing agent
  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile.custom
    container_name: vtuber_orchestrator
    environment:
      - OLLAMA_HOST=http://vtuber-ollama:11434
      - API_REGISTRY_PATH=/config/api_registry.yaml
      - LOG_LEVEL=INFO
      - CENTRAL_MANAGER_URL=${CENTRAL_MANAGER_URL:-http://86.106.138.188:8010}
      - CENTRAL_MANAGER_TOKEN=${CENTRAL_MANAGER_TOKEN:-default-token}
      - ORCHESTRATOR_NAME=vtuber_orchestrator
      - ORCHESTRATOR_URL=http://host.docker.internal:8082
      - DECISION_TIMEOUT_MS=10
      - PYTHONUNBUFFERED=1
    volumes:
      # - ./api_registry.yaml:/config/api_registry.yaml:ro  # Now included in Docker image
      - ./logs/orchestrator:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker socket for container control
      - ./orchestrator/src:/app/src:ro  # Mount source code for updates
    ports:
      - "8082:8080"  # Using 8082 since 8080 is taken by nginx_rtmp
    networks:
      - vtuber_network
    depends_on:
      - vtuber-ollama
      - neurosync_s1
      - autogen_agent
      # - redis_scb (using external Redis)
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"

  # Watchtower - Auto-update orchestrator when new images are pushed
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower_orchestrator
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INTERVAL=${WATCHTOWER_INTERVAL:-300}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_ROLLING_RESTART=${WATCHTOWER_ROLLING_RESTART:-true}
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_INCLUDE_RESTARTING=false
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
      - WATCHTOWER_MONITOR_ONLY=${WATCHTOWER_MONITOR_ONLY:-false}
    command: --label-enable --scope autonomy-cluster
    networks:
      - vtuber_network
    depends_on:
      - orchestrator

  # Update Orchestrator - Auto-rebuild on code changes
  update_orchestrator:
    image: python:3.11-alpine
    container_name: update_orchestrator
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/Unreal_Vtuber  # Mount as Unreal_Vtuber for consistency
      - ./update-orchestrator/state:/state
      - ~/.ssh:/root/.ssh:ro
    environment:
      - UPDATE_MODE=${UPDATE_MODE:-dual}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}  # 1 minute for testing
      - AUTO_APPROVE=${AUTO_APPROVE:-true}  # Auto-rebuild on changes
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - REPO_PATH=/Unreal_Vtuber
      - STATE_DIR=/state
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: |
      sh -c "
      apk add --no-cache git docker-cli docker-compose curl bash jq &&
      pip install pyyaml requests &&
      git config --global --add safe.directory /Unreal_Vtuber &&
      while true; do
        echo '[Update Check] '$(date);
        cd /Unreal_Vtuber;
        git fetch origin main;
        LOCAL=\$$(git rev-parse HEAD);
        REMOTE=\$$(git rev-parse origin/main);
        echo \"Local: \$$LOCAL, Remote: \$$REMOTE\";
        if [ \"\$$LOCAL\" != \"\$$REMOTE\" ]; then
          echo '[UPDATE] New version detected! Pulling changes...';
          git pull origin main;
          echo '[UPDATE] Stopping old containers...';
          docker-compose down;
          echo '[UPDATE] Rebuilding all containers with --no-cache...';
          docker-compose build --no-cache;
          echo '[UPDATE] Starting entire cluster...';
          docker-compose up -d;
          echo '[UPDATE] Verifying all services are running...';
          docker-compose ps;
          echo '[UPDATE] Complete!';
        else
          echo '[UPDATE] No changes detected';
          echo '[UPDATE] Ensuring all services are running...';
          docker-compose up -d;
        fi;
        echo '{\"last_check\": \"'$(date -Iseconds)'\"}' > /state/last_check.json;
        echo '[Sleep] Waiting 60 seconds...';
        sleep 60;
      done
      "
    restart: unless-stopped
    networks:
      - vtuber_network
    labels:
      - "com.centurylinklabs.watchtower.enable=false"  # Don't update the updater

  # ===========================================
  # LIVEPEER BYOC SERVICES
  # ===========================================
  
  # Livepeer Worker - Agent network capability
  livepeer-worker:
    build:
      context: ./livepeer-worker
      dockerfile: Dockerfile
    container_name: livepeer-worker
    ports:
      - "9876:9876"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Read-only Docker socket access
    environment:
      # Use host port for orchestrator connection (works whether orchestrator is internal or external)
      - ORCH_URL=${LIVEPEER_ORCH_URL:-http://host.docker.internal:9995}
      - ORCH_SECRET=${LIVEPEER_ORCH_SECRET:-orch-secret}
      - CAPABILITY_NAME=${CAPABILITY_NAME:-agent-net}  # Can be overridden in .env
      - CAPABILITY_DESCRIPTION=Agent network capability with connectivity monitoring
      - CAPABILITY_URL=http://livepeer-worker:9876
      - CAPABILITY_PRICE_PER_UNIT=${CAPABILITY_PRICE_PER_UNIT:-0}  # Set to 0 for testing
      - CAPABILITY_PRICE_SCALING=1
      - CAPABILITY_CAPACITY=10
      - PYTHONUNBUFFERED=1
      - MANAGER_URL=http://host.docker.internal:8010
      - CONNECTIVITY_PROOF_ENABLED=true
      - MIN_SERVICE_UPTIME=80.0  # Require 80% uptime for payment eligibility
    networks:
      - vtuber_network
      # Note: livepeer-orchestrator dependency removed - can work with external orchestrator
    extra_hosts:
      - "host.docker.internal:host-gateway"  # For accessing orchestrator via host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"

  # Livepeer Orchestrator - BYOC orchestrator (isolated network)
  livepeer-orchestrator:
    image: livepeer/go-livepeer:latest
    container_name: livepeer-orchestrator
    volumes:
      - ../data/orchestrator:/data
    ports:
      - "9995:9995"
    command: [
      "-orchestrator",
      "-orchSecret=${LIVEPEER_ORCH_SECRET:-orch-secret}",
      "-serviceAddr=0.0.0.0:9995",  # Bind to all interfaces for cross-network access
      "-v=6",
      "-network=${LIVEPEER_NETWORK:-arbitrum-one-mainnet}",
      "-ethUrl=${ETH_RPC_URL:-https://arb1.arbitrum.io/rpc}",
      "-ethPassword=${ETH_PASSWORD}",
      "-dataDir=/data",
      "-ethOrchAddr=${ETH_ORCH_ADDRESS}",
      "-pricePerUnit=${PRICE_PER_UNIT:-0}",  # Set to 0 for testing
      "-ticketEV=${TICKET_EV:-0}",
      "-maxFaceValue=${MAX_FACE_VALUE:-0}",
      "-autoAdjustPrice=${AUTO_ADJUST_PRICE:-false}",
      "-maxGasPrice=${MAX_GAS_PRICE:-1000000000}"
    ]
    networks:
      - livepeer_network  # Isolated network for security
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9995/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"

  # ===========================================
  # INFRASTRUCTURE SERVICES
  # ===========================================

  # Ollama for local LLM
  vtuber-ollama:
    image: ollama/ollama:latest
    container_name: vtuber-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    networks:
      - vtuber_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NGINX RTMP for streaming
  nginx_rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: nginx_rtmp
    ports:
      - "1935:1935"
      - "8085:8080"  # Changed from 8080 to 8085 to avoid conflict
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - vtuber_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # DATA STORES
  # ===========================================

  # Redis - Using shared Redis from manager for inter-service communication
  # Commented out as we'll use the external Redis on port 6379
  # redis_scb:
  #   image: redis:7-alpine
  #   container_name: redis_scb
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - vtuber_network
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes

  # PostgreSQL for AutoGen
  autogen_postgres:
    image: ankane/pgvector:latest
    container_name: autogen_postgres
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=autonomous_agent
    volumes:
      - autonomous_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped
    networks:
      - vtuber_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Neo4j for semantic graph
  autogen_neo4j:
    image: neo4j:5-community
    container_name: autogen_neo4j
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_dbms_memory_pagecache_size=512M
      - NEO4J_dbms_memory_heap_initial__size=512M
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_connector_bolt_advertised__address=autogen_neo4j:7687
      - NEO4J_dbms_connector_http_advertised__address=autogen_neo4j:7474
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: unless-stopped
    networks:
      - vtuber_network
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # MONITORING STACK
  # ===========================================

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - vtuber_network
    restart: unless-stopped

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - vtuber_network
    restart: unless-stopped
    depends_on:
      - prometheus

  # Node Exporter - System Metrics
  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - vtuber_network
    restart: unless-stopped

  # cAdvisor - Container Metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8090:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - vtuber_network
    restart: unless-stopped

  # Redis Exporter
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis_scb:6379
    networks:
      - vtuber_network
    restart: unless-stopped

  # Postgres Exporter for AutoGen
  postgres_exporter_autogen:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter_autogen
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@autogen_postgres:5432/autonomous_agent?sslmode=disable
    networks:
      - vtuber_network
    restart: unless-stopped
    depends_on:
      - autogen_postgres

  # Ollama Exporter
  ollama_exporter:
    build:
      context: ./monitoring/exporters
      dockerfile: Dockerfile.ollama
      no_cache: true
    container_name: ollama_exporter
    ports:
      - "9122:9122"
    environment:
      - OLLAMA_HOST=http://vtuber-ollama:11434
      - EXPORTER_PORT=9122
    networks:
      - vtuber_network
    restart: unless-stopped
    depends_on:
      - vtuber-ollama

  # NGINX Exporter
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri=http://nginx_rtmp:8080/status
    networks:
      - vtuber_network
    restart: unless-stopped
    depends_on:
      - nginx_rtmp

volumes:
  redis_data:
  autonomous_postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  vtuber_network:
    driver: bridge
    name: vtuber_network
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "172.17.0.1"
  
  livepeer_network:
    driver: bridge
    name: livepeer_network
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "172.18.0.1"