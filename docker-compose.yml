services:
  # ===========================================
  # LIVEPEER BYOC SERVICES
  # ===========================================

  livepeer-worker:
    build:
      context: ./livepeer-worker
      dockerfile: Dockerfile
    container_name: livepeer-worker
    ports:
      - "9876:9876"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - ORCH_URL=${LIVEPEER_ORCH_URL:-http://livepeer-orchestrator:9995}
      - ORCH_SECRET=${LIVEPEER_ORCH_SECRET:-orch-secret}
      - CAPABILITY_NAME=${CAPABILITY_NAME:-agent-net}
      - CAPABILITY_DESCRIPTION=Agent network capability with connectivity monitoring
      - CAPABILITY_URL=http://livepeer-worker:9876
      - CAPABILITY_PRICE_PER_UNIT=${CAPABILITY_PRICE_PER_UNIT:-0}
      - CAPABILITY_PRICE_SCALING=1
      - CAPABILITY_CAPACITY=10
      - PYTHONUNBUFFERED=1
      - MANAGER_URL=${CENTRAL_MANAGER_URL:-http://86.106.138.188:8010}
      - CONNECTIVITY_PROOF_ENABLED=true
      - MIN_SERVICE_UPTIME=80.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - vtuber_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9876/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"

  # ===========================================
  # SUPPORTING SERVICES
  # ===========================================

  vtuber-ollama:
    image: ollama/ollama:latest
    container_name: vtuber-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    networks:
      - vtuber_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama_loader:
    image: curlimages/curl:latest
    container_name: ollama_loader
    depends_on:
      - vtuber-ollama
    networks:
      - vtuber_network
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama to be ready...' &&
        sleep 10 &&
        echo 'Pulling fast models for optimized performance...' &&
        curl -X POST http://vtuber-ollama:11434/api/pull -d '{\"name\": \"llama3.2:3b\"}' &&
        curl -X POST http://vtuber-ollama:11434/api/pull -d '{\"name\": \"tinyllama:latest\"}' &&
        curl -X POST http://vtuber-ollama:11434/api/pull -d '{\"name\": \"phi-2:latest\"}' &&
        echo 'Pulling nomic-embed-text model for embeddings...' &&
        curl -X POST http://vtuber-ollama:11434/api/pull -d '{\"name\": \"nomic-embed-text:latest\"}' &&
        echo 'Models pull initiated' &&
        sleep 60 &&
        echo 'Loading models into memory...' &&
        curl -X POST http://vtuber-ollama:11434/api/generate -d '{\"model\": \"llama3.2:3b\", \"prompt\": \"Hello\", \"stream\": false}' &&
        curl -X POST http://vtuber-ollama:11434/api/generate -d '{\"model\": \"tinyllama:latest\", \"prompt\": \"Hi\", \"stream\": false}' &&
        echo 'Models loaded successfully'
      "
    restart: "no"

  nginx_rtmp:
    image: tiangolo/nginx-rtmp:latest
    container_name: nginx_rtmp
    ports:
      - "1935:1935"
      - "8085:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - vtuber_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  management-agent:
    build:
      context: ./management-agent
      dockerfile: Dockerfile
    container_name: management_agent
    ports:
      - "8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./:/Unreal_Vtuber:rw
      - ./backups:/backups
    environment:
      - COMPOSE_FILE=/Unreal_Vtuber/docker-compose.yml
      - BACKUP_DIR=/backups
      - CLUSTER_NAME=${CLUSTER_NAME:-vtuber-cluster}
      - MANAGER_URL=${CENTRAL_MANAGER_URL:-http://86.106.138.188:8010}
      - LOG_LEVEL=INFO
    networks:
      - vtuber_network
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"

  # ===========================================
  # OBSERVABILITY
  # ===========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - vtuber_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - vtuber_network
    restart: unless-stopped
    depends_on:
      - prometheus

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - vtuber_network
    restart: unless-stopped

  ollama_exporter:
    build:
      context: ./monitoring/exporters
      dockerfile: Dockerfile.ollama
      no_cache: true
    container_name: ollama_exporter
    ports:
      - "9122:9122"
    environment:
      - OLLAMA_HOST=http://vtuber-ollama:11434
      - EXPORTER_PORT=9122
    networks:
      - vtuber_network
    restart: unless-stopped
    depends_on:
      - vtuber-ollama

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx_exporter
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri=http://nginx_rtmp:8080/status
    networks:
      - vtuber_network
    restart: unless-stopped
    depends_on:
      - nginx_rtmp

volumes:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  vtuber_network:
    driver: bridge
    name: vtuber_network
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "172.17.0.1"
