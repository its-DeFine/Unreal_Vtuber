; PixelStreaming2 "Game" config for packaged Linux build.
;
; Some UE5 PixelStreaming2 builds load plugin settings from `config=Game`
; (and will log as: [/Script/PixelStreaming2Settings.PixelStreaming2PluginSettings]).
;
; We force H.264 + periodic keyframes to keep long-running streams stable.

[/Script/PixelStreaming2Settings.PixelStreaming2PluginSettings]
Codec=H264
AutoStartStream=True
LatencyMode=LowLatency
KeyframeInterval=60
