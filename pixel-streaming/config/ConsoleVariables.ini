; High-quality Pixel Streaming overrides applied at container startup.
; These values are sourced from Epic's stream tuning guide to prioritise image quality.

[Startup]
PixelStreaming.Encoder.BitrateMode=CBR
PixelStreaming.Encoder.TargetBitrate=15000000
PixelStreaming.Encoder.MaxBitrate=20000000
PixelStreaming.Encoder.MinBitrate=10000000
PixelStreaming.Encoder.MinQP=10
PixelStreaming.Encoder.MaxQP=30
PixelStreaming.Encoder.MaxThreads=4
PixelStreaming.Encoder.MinFPS=60
PixelStreaming.Encoder.MaxFPS=60
PixelStreaming.PrioritizeQuality=1

; Explicit H.264 overrides (UE uses the codec-specific namespace when available).
PixelStreaming.Encoder.H264.TargetBitrate=15000000
PixelStreaming.Encoder.H264.MaxBitrate=20000000
PixelStreaming.Encoder.H264.MinBitrate=10000000
PixelStreaming.Encoder.H264.MinQP=10
PixelStreaming.Encoder.H264.MaxQP=30

; Encourage WebRTC to start at the high bitrate straight away.
PixelStreaming.WebRTC.MinBitrate=12000000
PixelStreaming.WebRTC.MaxBitrate=22000000
PixelStreaming.WebRTC.StartBitrate=15000000
