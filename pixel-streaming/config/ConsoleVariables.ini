; High-quality Pixel Streaming overrides applied at container startup.
; Tuned for maximum visual fidelity on 1080p streams.

[Startup]
r.ScreenPercentage=100
r.DynamicRes.OperationMode=0
r.DynamicRes.MinScreenPercentage=100
r.DynamicRes.MaxScreenPercentage=100
r.SetRes=1920x1080f
t.MaxFPS=60
PixelStreaming.Encoder.BitrateMode=CBR
PixelStreaming.Encoder.TargetBitrate=45000000
PixelStreaming.Encoder.MaxBitrate=52000000
PixelStreaming.Encoder.MinBitrate=12000000
PixelStreaming.Encoder.MinQP=8
PixelStreaming.Encoder.MaxQP=28
PixelStreaming.Encoder.MaxThreads=4
PixelStreaming.Encoder.MinFPS=60
PixelStreaming.Encoder.MaxFPS=60
PixelStreaming.PrioritizeQuality=1

; Explicit H.264 overrides (UE uses the codec-specific namespace when available).
PixelStreaming.Encoder.H264.TargetBitrate=45000000
PixelStreaming.Encoder.H264.MaxBitrate=52000000
PixelStreaming.Encoder.H264.MinBitrate=12000000
PixelStreaming.Encoder.H264.MinQP=8
PixelStreaming.Encoder.H264.MaxQP=28

; Encourage WebRTC to start high and stay high.
PixelStreaming.WebRTC.MinBitrate=15000000
PixelStreaming.WebRTC.MaxBitrate=55000000
PixelStreaming.WebRTC.StartBitrate=45000000
PixelStreaming.WebRTC.DisableVP8=1
PixelStreaming.WebRTC.DisableVP9=1
PixelStreaming.WebRTC.DisableAV1=1
PixelStreaming.WebRTC.VideoCodec=H264
