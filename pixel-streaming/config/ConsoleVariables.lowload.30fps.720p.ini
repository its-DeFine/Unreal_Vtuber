; Low-load Pixel Streaming preset (opt-in) for multi-instance hosts.
; Target: 720p @ 30fps with reduced bitrates to lower GPU/encoder pressure.
;
; Enable by setting:
;   VTUBER_CONSOLE_VARIABLES_FILE=./pixel-streaming/config/ConsoleVariables.lowload.30fps.720p.ini
; and overriding the forced resolution if needed:
;   EMBODY_EXTRA_ARGS="-ForceRes -ResX=1280 -ResY=720 -PixelStreamingAllowCodecNames=H264 -PixelStreamingDisableVP8 -PixelStreamingDisableVP9"

[Startup]
r.ScreenPercentage=85
r.DynamicRes.OperationMode=0
r.DynamicRes.MinScreenPercentage=85
r.DynamicRes.MaxScreenPercentage=85
r.SetRes=1280x720f
t.MaxFPS=30
PixelStreaming.Encoder.BitrateMode=CBR
PixelStreaming.Encoder.TargetBitrate=12000000
PixelStreaming.Encoder.MaxBitrate=15000000
PixelStreaming.Encoder.MinBitrate=4000000
PixelStreaming.Encoder.MinQP=12
PixelStreaming.Encoder.MaxQP=34
PixelStreaming.Encoder.MaxThreads=2
PixelStreaming.Encoder.MinFPS=30
PixelStreaming.Encoder.MaxFPS=30
PixelStreaming.PrioritizeQuality=0

; Explicit H.264 overrides (UE uses the codec-specific namespace when available).
PixelStreaming.Encoder.H264.TargetBitrate=12000000
PixelStreaming.Encoder.H264.MaxBitrate=15000000
PixelStreaming.Encoder.H264.MinBitrate=4000000
PixelStreaming.Encoder.H264.MinQP=12
PixelStreaming.Encoder.H264.MaxQP=34

; Encourage WebRTC to start high and stay high (within the smaller envelope).
PixelStreaming.WebRTC.MinBitrate=3000000
PixelStreaming.WebRTC.MaxBitrate=20000000
PixelStreaming.WebRTC.StartBitrate=8000000
PixelStreaming.WebRTC.DisableVP8=1
PixelStreaming.WebRTC.DisableVP9=1
PixelStreaming.WebRTC.DisableAV1=1
PixelStreaming.WebRTC.VideoCodec=H264
