; Ultra low-load Pixel Streaming preset (opt-in) for multi-instance hosts.
; Target: 720p @ 20fps with aggressive scalability cuts to reduce render GPU utilization.
;
; Enable by setting:
;   VTUBER_CONSOLE_VARIABLES_FILE=./pixel-streaming/config/ConsoleVariables.lowload.20fps.720p.ini
; and overriding the forced resolution if needed:
;   EMBODY_EXTRA_ARGS="-ForceRes -ResX=1280 -ResY=720 -PixelStreamingAllowCodecNames=H264 -PixelStreamingDisableVP8 -PixelStreamingDisableVP9"

[Startup]
; Reduce per-frame render cost (internal render scale) while keeping a 720p stream size.
r.ScreenPercentage=50
r.DynamicRes.OperationMode=0
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=50
r.SetRes=1280x720f

; Cap render/stream FPS.
t.MaxFPS=20
PixelStreaming.Encoder.MinFPS=20
PixelStreaming.Encoder.MaxFPS=20
PixelStreaming.Encoder.MinQP=16
PixelStreaming.Encoder.MaxQP=40
PixelStreaming.Encoder.MaxThreads=2
PixelStreaming.PrioritizeQuality=0

; Encoder bitrate envelope (smaller to reduce NVENC + network pressure).
PixelStreaming.Encoder.BitrateMode=CBR
PixelStreaming.Encoder.TargetBitrate=6000000
PixelStreaming.Encoder.MaxBitrate=8000000
PixelStreaming.Encoder.MinBitrate=2000000

; Explicit H.264 overrides (UE uses the codec-specific namespace when available).
PixelStreaming.Encoder.H264.TargetBitrate=6000000
PixelStreaming.Encoder.H264.MaxBitrate=8000000
PixelStreaming.Encoder.H264.MinBitrate=2000000
PixelStreaming.Encoder.H264.MinQP=16
PixelStreaming.Encoder.H264.MaxQP=40

; WebRTC bitrate hints (keep within the smaller envelope).
PixelStreaming.WebRTC.MinBitrate=1500000
PixelStreaming.WebRTC.MaxBitrate=12000000
PixelStreaming.WebRTC.StartBitrate=4000000
PixelStreaming.WebRTC.DisableVP8=1
PixelStreaming.WebRTC.DisableVP9=1
PixelStreaming.WebRTC.DisableAV1=1
PixelStreaming.WebRTC.VideoCodec=H264

; Scalability (aggressive).
sg.ViewDistanceQuality=0
sg.AntiAliasingQuality=0
sg.ShadowQuality=0
sg.PostProcessQuality=0
sg.TextureQuality=0
sg.EffectsQuality=0
sg.FoliageQuality=0
sg.ShadingQuality=0

; Additional high-impact render cost reductions (safe-ish defaults).
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0
r.BloomQuality=0
r.LensFlareQuality=0
r.LightShaftQuality=0
r.EyeAdaptationQuality=0
r.AmbientOcclusionLevels=0
r.SSR.Quality=0
r.VolumetricFog=0
r.Fog=0
