; PixelStreaming2 settings overrides for packaged Linux build.
;
; This repo historically used Pixel Streaming (v1) CVars/flags like:
;   - PixelStreaming.WebRTC.DisableVP9=1
;   - -PixelStreamingDisableVP9
; Those are ignored by UE's PixelStreaming2 pipeline (UE5.4+/UE5.5+), which can
; default to VP9. VP9 output forces downstream broadcast bridges to decode+re-
; encode, which is substantially less stable for long RTMP runs.
;
; Force H.264 so downstream tooling can passthrough H.264 instead of VP9→H.264.

[/Script/PixelStreaming2.PixelStreaming2Settings]
Codec=H264
WebRTCNegotiateCodecs=True
CodecPreferences=H264

; Some builds use b-prefixed bool names. Keeping both is harmless.
bWebRTCNegotiateCodecs=True

