; PixelStreaming2 settings overrides for packaged Linux build.
;
; NOTE: This project originally targeted Pixel Streaming (v1) where codec control
; lived under `PixelStreaming.*` CVars and CLI flags like `-PixelStreamingDisableVP9`.
; UE5.4+/UE5.5+ PixelStreaming2 ignores those legacy flags and can default to VP9.
;
; We force H.264 here so downstream broadcast tooling can do H.264 passthrough
; (no VP9 decode → H.264 re-encode), which is materially more stable for RTMP.

[/Script/PixelStreaming2.PixelStreaming2Settings]
; Primary selection used by PixelStreaming2Settings (logged as Property [Codec]).
Codec=H264

; Prefer negotiating codecs when possible, but constrain to H.264 either way.
WebRTCNegotiateCodecs=True
CodecPreferences=H264

; Some builds/branches use b-prefixed bool names; keep both for safety.
bWebRTCNegotiateCodecs=True

