[SERVICE]
    Flush        1
    Grace        5
    Daemon       Off
    Log_Level    info

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Tag               docker
    Refresh_Interval  5
    Skip_Long_Lines   On
    Mem_Buf_Limit     10MB
    DB                /var/embody/audit/docker.db
    DB.Sync           Normal

[FILTER]
    Name      grep
    Match     docker
    Regex     log    payments-backend

[INPUT]
    Name              tail
    Path              /var/embody/data/registry.json
    Tag               registry
    Refresh_Interval  5
    Read_from_Head    true
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Path              /var/embody/audit/registry.log
    Tag               registry.audit
    Refresh_Interval  5
    Read_from_Head    true
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

[OUTPUT]
    Name              file
    Match             *
    Path              /var/embody/audit
    File              payments-audit.log
