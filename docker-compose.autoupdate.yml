version: '3.8'

# This is an enhanced version with auto-update for all critical services
services:
  # NeuroSync S1 - VTuber Avatar System (AUTO-UPDATED)
  neurosync_s1:
    image: ghcr.io/its-define/neurosync-s1:latest
    container_name: neurosync_s1
    mem_limit: 12g
    command: [/app/entrypoint_bridge.sh]
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - FLASK_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - ALLOWED_ORIGINS=*
      - PLAYER_PORT=5001
      - USE_REDIS_SCB=true
      - REDIS_URL=redis://redis_scb:6379/0
      - LLM_PROVIDER=openai
      - OLLAMA_HOST=http://vtuber-ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - OPENAI_MODEL=gpt-4o
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - vtuber_network
    volumes:
      - ./docker-vtuber/app/AVATAR/NeuroBridge:/app/NeuroBridge
    env_file:
      - .env
    depends_on:
      - vtuber-ollama
      - kokoro_tts
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"

  # AutoGen Multi-Agent System (AUTO-UPDATED)
  autogen_agent:
    image: ghcr.io/its-define/autogen-agent:latest
    container_name: autogen_agent
    command: sh -c "pip install 'neo4j>=5.0.0' 'fastembed>=0.4.0' && python -m autogen_agent.simplified_main"
    volumes:
      - ./docker-vtuber/app/CORE/autogen-agent/autogen_agent:/app/autogen_agent
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@autogen_postgres:5432/autonomous_agent
      - USE_COGNITIVE_ENHANCEMENT=true
      - OLLAMA_HOST=http://vtuber-ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - VTUBER_ENDPOINT_URL=http://neurosync_s1:5001
    ports:
      - "8200:8000"
    networks:
      - vtuber_network
    depends_on:
      - autogen_postgres
      - autogen_neo4j
      - vtuber-ollama
      - neurosync_s1
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"

  # Orchestrator (AUTO-UPDATED)
  orchestrator:
    image: ghcr.io/its-define/autonomy-orchestrator:autonomy-latest
    container_name: vtuber_orchestrator
    environment:
      - OLLAMA_HOST=http://vtuber-ollama:11434
      - API_REGISTRY_PATH=/config/api_registry.yaml
      - LOG_LEVEL=INFO
    volumes:
      - ./api_registry.yaml:/config/api_registry.yaml:ro
      - ./logs/orchestrator:/logs
    ports:
      - "8082:8080"
    networks:
      - vtuber_network
    depends_on:
      - vtuber-ollama
      - neurosync_s1
      - autogen_agent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"

  # Ollama (AUTO-UPDATED for base image, not models)
  vtuber-ollama:
    image: ollama/ollama:latest
    container_name: vtuber-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - vtuber_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "com.centurylinklabs.watchtower.scope=autonomy-cluster"
      - "com.centurylinklabs.watchtower.monitor-only=false"

  # Watchtower - Enhanced with notifications
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower_orchestrator
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INTERVAL=${WATCHTOWER_INTERVAL:-300}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_ROLLING_RESTART=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_INCLUDE_RESTARTING=false
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
      - WATCHTOWER_MONITOR_ONLY=${WATCHTOWER_MONITOR_ONLY:-false}
      # Optional: Add notifications
      # - WATCHTOWER_NOTIFICATION_URL=slack://hook-url
      # - WATCHTOWER_NOTIFICATION_URL=email://smtp-server
    command: --label-enable --scope autonomy-cluster
    networks:
      - vtuber_network

  # Model Updater - Periodic model updates
  model_updater:
    image: alpine:latest
    container_name: model_updater
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OLLAMA_MODELS=llama3.2:3b,llama3.1,mistral
      - UPDATE_INTERVAL=86400  # Daily
    command: |
      sh -c "
      apk add --no-cache docker-cli curl
      while true; do
        echo 'Updating Ollama models...'
        for model in \$${OLLAMA_MODELS//,/ }; do
          docker exec vtuber-ollama ollama pull \$$model || true
        done
        echo 'Model update complete. Sleeping for \$$UPDATE_INTERVAL seconds...'
        sleep \$$UPDATE_INTERVAL
      done
      "
    networks:
      - vtuber_network
    restart: unless-stopped

volumes:
  ollama_data:

networks:
  vtuber_network:
    external: true