services:
  livepeer-orchestrator:
    image: livepeer/go-livepeer:latest
    container_name: livepeer-orchestrator
    runtime: nvidia
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - vtuber_network
    ports:
      - 9995:9995
      - 127.0.0.1:7935:7935
    volumes:
      - vtuber_orch_data:/root/.lpData
      - livepeer_models:/models
      - ./config/keystore:/root/.lpData/keystore:ro
      - ./config/ethpass:/root/.lpData/.ethpass:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - "-orchestrator"
      - "-transcoder"
      - "-aiWorker"
      - "-network"
      - "${LIVEPEER_NETWORK:-arbitrum-one-mainnet}"
      - "-ethUrl"
      - "${ETH_RPC_URL:-https://arb1.arbitrum.io/rpc}"
      - "-serviceAddr"
      - "${ORCHESTRATOR_HOST:-0.0.0.0}:${ORCHESTRATOR_PORT:-9995}"
      - "-cliAddr"
      - "0.0.0.0:7935"
      - "-orchSecret"
      - "${LIVEPEER_ORCH_SECRET:-orch-secret}"
      - "-blockPollingInterval"
      - "20"
      - "-pricePerUnit"
      - "${PRICE_PER_UNIT:-0}"
      - "-ticketEV"
      - "${TICKET_EV:-0}"
      - "-maxGasPrice"
      - "${MAX_GAS_PRICE:-1000000000}"
      - "-autoAdjustPrice"
      - "${AUTO_ADJUST_PRICE:-false}"
      - "-reward"
      - "false"
      - "-ethPassword"
      - "@${ETH_PASSWORD_FILE:-/root/.lpData/.ethpass}"
      - "-ethAcctAddr"
      - "${ETH_ADDRESS:-}"
      - "-ethOrchAddr"
      - "${ETH_ORCH_ADDRESS:-}"
      - "-ethKeystoreDir"
      - "/root/.lpData/keystore"
      - "-datadir"
      - "/root/.lpData"
      - "-monitor"
      - "true"
      - "-aiVerboseLogs"
      - "true"
      - "-testTranscoder"
      - "false"
      - "-startupAvailabilityCheck"
      - "false"
      - "-v"
      - "6"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  vtuber_network:
    external: true
    name: vtuber_network

volumes:
  vtuber_orch_data:
  livepeer_models:
