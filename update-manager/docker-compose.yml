version: '3.8'

services:
  # Update Manager - Handles full cluster updates including docker-compose changes
  update_manager:
    image: alpine/git:latest
    container_name: update_manager
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      - ~/.ssh:/root/.ssh:ro  # For private repos
      - ./update_config.yaml:/config/update_config.yaml
    environment:
      - UPDATE_INTERVAL=${UPDATE_INTERVAL:-3600}  # Check every hour
      - REPO_URL=https://github.com/its-DeFine/agent-net.git
      - BRANCH=embody-alpha
      - AUTO_UPDATE=${AUTO_UPDATE:-false}
      - WEBHOOK_URL=${WEBHOOK_URL:-}  # Optional webhook for notifications
    command: |
      sh -c "
      apk add --no-cache docker-cli docker-compose curl bash jq
      
      while true; do
        echo '[UPDATE CHECK] Checking for updates...'
        
        # Check for updates
        cd /workspace
        git fetch origin
        
        LOCAL=\$$(git rev-parse HEAD)
        REMOTE=\$$(git rev-parse origin/${BRANCH})
        
        if [ \"\$$LOCAL\" != \"\$$REMOTE\" ]; then
          echo '[UPDATE] New version available!'
          
          if [ \"\$$AUTO_UPDATE\" = \"true\" ]; then
            echo '[UPDATE] Starting automatic update...'
            
            # Pull latest changes
            git pull origin ${BRANCH}
            git submodule update --init --recursive
            
            # Check docker-compose changes
            if git diff \$$LOCAL..\$$REMOTE --name-only | grep -q docker-compose.yml; then
              echo '[UPDATE] Docker-compose changes detected, full rebuild required'
              
              # Stop old containers
              docker-compose down
              
              # Start new containers
              docker-compose up -d
              
              # Health checks
              sleep 30
              HEALTHY=true
              
              # Check orchestrator
              if ! curl -sf http://localhost:8082/health > /dev/null; then
                echo '[ERROR] Orchestrator health check failed'
                HEALTHY=false
              fi
              
              # Check neurosync
              if ! curl -sf http://localhost:5001/health > /dev/null; then
                echo '[ERROR] NeuroSync health check failed'
                HEALTHY=false
              fi
              
              if [ \"\$$HEALTHY\" = \"true\" ]; then
                echo '[UPDATE] Update completed successfully'
                
                # Send success notification
                if [ -n \"\$$WEBHOOK_URL\" ]; then
                  curl -X POST \"\$$WEBHOOK_URL\" \
                    -H 'Content-Type: application/json' \
                    -d '{\"text\":\"Orchestrator cluster updated successfully to '\"$$REMOTE\"'\"}'
                fi
              else
                echo '[ERROR] Health checks failed, rolling back...'
                git checkout \$$LOCAL
                docker-compose down
                docker-compose up -d
              fi
            else
              echo '[UPDATE] No docker-compose changes, Watchtower will handle image updates'
            fi
          else
            echo '[UPDATE] Auto-update disabled, manual intervention required'
            
            # Send notification about available update
            if [ -n \"\$$WEBHOOK_URL\" ]; then
              curl -X POST \"\$$WEBHOOK_URL\" \
                -H 'Content-Type: application/json' \
                -d '{\"text\":\"Orchestrator update available but auto-update is disabled\"}'
            fi
          fi
        else
          echo '[UPDATE CHECK] No updates available'
        fi
        
        echo '[UPDATE CHECK] Sleeping for \$$UPDATE_INTERVAL seconds...'
        sleep \$$UPDATE_INTERVAL
      done
      "
    restart: unless-stopped
    networks:
      - vtuber_network

networks:
  vtuber_network:
    external: true