# Update Manager Configuration
# Controls how the orchestrator cluster updates itself

update_strategy:
  # Type of update strategy
  # Options: rolling, blue-green, recreate
  type: rolling
  
  # Check for updates every N seconds
  check_interval: 3600  # 1 hour
  
  # Automatically apply updates
  auto_update: false
  
  # Require manual approval for major version changes
  require_approval_for_major: true
  
  # Maximum number of update retries
  max_retries: 3
  
  # Rollback on failure
  rollback_on_failure: true

# Services to monitor for health
health_checks:
  - name: orchestrator
    url: http://localhost:8082/health
    timeout: 30
    required: true
    
  - name: neurosync_s1
    url: http://localhost:5001/health
    timeout: 30
    required: true
    
  - name: autogen_agent
    url: http://localhost:8200/health
    timeout: 30
    required: false
    
  - name: ollama
    url: http://localhost:11434/api/tags
    timeout: 10
    required: false

# Update triggers
triggers:
  # Watch for changes in these files
  watch_files:
    - docker-compose.yml
    - docker-compose.*.yml
    - .env
    - api_registry.yaml
    
  # Watch for changes in these directories
  watch_dirs:
    - orchestrator/
    - docker-vtuber/app/AVATAR/
    - docker-vtuber/app/CORE/
    
  # Ignore these patterns
  ignore_patterns:
    - "*.log"
    - "*.tmp"
    - "__pycache__/"
    - ".git/"

# Backup configuration
backup:
  enabled: true
  location: /backups
  retention_days: 7
  backup_volumes: false  # Can be large
  
# Notification settings
notifications:
  # Webhook URL for notifications (Slack, Discord, etc.)
  webhook_url: ""
  
  # Email notifications
  email:
    enabled: false
    smtp_server: ""
    from: "update-manager@example.com"
    to: ["admin@example.com"]
    
  # Events to notify about
  notify_on:
    - update_available
    - update_started
    - update_completed
    - update_failed
    - rollback_performed

# Advanced settings
advanced:
  # Grace period before stopping containers (seconds)
  stop_grace_period: 30
  
  # Parallel container updates (for large clusters)
  parallel_updates: 1
  
  # Network mode for update operations
  network_mode: host
  
  # Custom pre-update script
  pre_update_script: ""
  
  # Custom post-update script
  post_update_script: ""
  
  # Environment-specific configurations
  environments:
    development:
      auto_update: true
      check_interval: 300  # 5 minutes
      
    staging:
      auto_update: true
      check_interval: 1800  # 30 minutes
      require_approval_for_major: false
      
    production:
      auto_update: false
      check_interval: 3600  # 1 hour
      require_approval_for_major: true
      backup_volumes: true